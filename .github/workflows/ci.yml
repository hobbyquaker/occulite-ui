name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The component tests run in a real chromium (layout, native <dialog>, focus).
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run publint
      - run: npm run pack:check
      - run: npm run size
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: size-report
          path: size-report/report.md
          if-no-files-found: error

  svelte-floor:
    # The lowest Svelte the peer range allows: the components are compiled by the consumer's Svelte,
    # so the floor is a promise that has to be tested, not assumed.
    name: Test against the Svelte peer floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          FLOOR=$(node -p "require('./package.json').peerDependencies.svelte.replace(/^\^/, '')")
          npm install --no-save "svelte@$FLOOR"
          node -p "'svelte ' + require('svelte/package.json').version"
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
